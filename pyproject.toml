[project]
name = "von-shadow"
version = "0.1.0"
description = "Run an open Jev-style decision model next to Claude Code in shadow mode, with an honest eval harness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["von-sdk==1.3.4"]

[project.scripts]
von-shadow = "von_shadow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
